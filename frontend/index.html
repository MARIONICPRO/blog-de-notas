<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Notes - Notas Rápidas</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div id="app">

        <!-- Barra superior -->
        <div class="window-bar">
            <div class="window-controls">
                <span class="dot dot-red"></span>
                <span class="dot dot-yellow"></span>
                <span class="dot dot-green"></span>
            </div>

            <span class="window-title">
                notas-rapidas.app
            </span>
        </div>

        <!-- Contenido -->
        <div class="main-content">

            <!-- Encabezado -->
            <header class="header">

                <div class="header-left">

                    <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <polyline points="14 2 14 8 20 8" />
                        <line x1="16" y1="13" x2="8" y2="13" />
                        <line x1="16" y1="17" x2="8" y2="17" />
                        <polyline points="10 9 9 9 8 9" />
                    </svg>

                    <h1>Notas rápidas</h1>

                </div>

                <div class="user-info">

                    <span id="userName" class="user-name" style="display:none;">
                        <i class="fa-regular fa-user"></i>
                        <span id="userNameText"></span>
                    </span>

                    <span id="noteCounter" class="note-counter" style="display:none;">
                        <i class="fa-regular fa-note-sticky"></i>
                        <span id="noteCounterText"></span>
                    </span>

                    <button id="loginBtn" class="btn-login">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        Iniciar Sesión
                    </button>

                    <button id="logoutBtn" class="btn-logout" style="display:none;">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Cerrar Sesión
                    </button>

                </div>

            </header>

            <!-- Agregar nota -->
            <div class="note-input-area">

                <div class="input-group">

                    <input type="text" id="noteInput" class="note-input"
                        placeholder="Escribe una nota y presiona Enter..." maxlength="1000" disabled>

                    <button id="addNoteBtn" class="btn-add" disabled>

                        <i class="fa-solid fa-plus"></i>

                        Agregar

                    </button>

                </div>

                <div class="char-counter" id="charCounter">

                    0 / 1000

                </div>

            </div>

            <!-- Contenedor -->
            <div id="notesContainer" class="notes-container">

                <!-- Estado vacío -->

                <div id="emptyState" class="empty-state">

                    <i class="fa-regular fa-note-sticky empty-icon"></i>

                    <h3>Aún no tienes notas</h3>

                    <p>Escribe tu primera idea arriba.</p>

                </div>

                <!-- Grid -->

                <div id="notesGrid" class="notes-grid" style="display:none;"></div>

            </div>

        </div>

    </div>

    <!-- Modal editar -->

    <div id="editModal" class="modal">

        <div class="modal-content">

            <h3>

                <i class="fa-solid fa-pen-to-square"></i>

                Editar nota

            </h3>

            <div class="modal-input-group">

                <textarea id="editNoteInput" class="modal-textarea" maxlength="1000"
                    placeholder="Escribe tu nota..."></textarea>

                <div class="char-counter modal-counter" id="editCharCounter">
                    0 / 1000
                </div>

            </div>

            <div class="modal-actions">

                <button id="saveEditBtn" class="btn btn-primary">

                    <i class="fa-regular fa-floppy-disk"></i>

                    Guardar

                </button>

                <button id="cancelEditBtn" class="btn btn-secondary">

                    <i class="fa-solid fa-xmark"></i>

                    Cancelar

                </button>

            </div>

        </div>

    </div>

    <script type="module" src="js/app.js"></script>

</body>

</html>
